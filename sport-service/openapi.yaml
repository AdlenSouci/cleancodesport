openapi: 3.1.0
info:
  title: Service métier — cours de sport
  version: 0.1.0
  description: |
    Contrat design-first du sport-service.

    **Pagination (offset)** : `GET /cours` accepte `limit` (taille de page, défaut 20,
    max 100) et `offset` (nombre d'éléments à sauter, défaut 0). La réponse contient
    `items`, `total` (nombre total de cours), `limit` et `offset` pour permettre au
    client de parcourir la collection.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Environnement de développement (docker compose)
tags:
  - name: technique
    description: Supervision
  - name: cours
    description: Cours collectifs, capacité et inscriptions
paths:
  /sante:
    get:
      tags: [technique]
      operationId: sante
      summary: Sonde de santé
      security: []
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                required: [statut]
                properties:
                  statut: { type: string, const: ok }

  /cours:
    get:
      tags: [cours]
      operationId: listerCours
      summary: Lister les cours (collection paginée)
      security: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page de cours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCours" }
        "400": { $ref: "#/components/responses/Probleme" }
    post:
      tags: [cours]
      operationId: creerCours
      summary: Créer un cours
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreerCours" }
      responses:
        "201":
          description: Cours créé
          headers:
            Location:
              description: URI du cours créé
              required: true
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cours" }
        "400": { $ref: "#/components/responses/Probleme" }
        "422": { $ref: "#/components/responses/Probleme" }

  /cours/{coursId}:
    get:
      tags: [cours]
      operationId: consulterCours
      summary: Consulter un cours
      security: []
      parameters:
        - $ref: "#/components/parameters/CoursId"
      responses:
        "200":
          description: Cours trouvé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cours" }
        "404": { $ref: "#/components/responses/Probleme" }

  /cours/{coursId}/inscriptions:
    post:
      tags: [cours]
      operationId: inscrireParticipant
      summary: Inscrire un participant à un cours
      description: |
        Action métier du second cas d'usage. Si des places restent, le participant
        est inscrit ; sinon il rejoint la liste d'attente. Un doublon est refusé.
      security: []
      parameters:
        - $ref: "#/components/parameters/CoursId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InscrireParticipant" }
      responses:
        "201":
          description: Inscription créée (inscrit ou liste d'attente)
          headers:
            Location:
              description: URI de l'inscription créée
              required: true
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultatInscription" }
        "404": { $ref: "#/components/responses/Probleme" }
        "409": { $ref: "#/components/responses/Probleme" }
        "422": { $ref: "#/components/responses/Probleme" }

  /cours/{coursId}/inscriptions/{participantId}:
    get:
      tags: [cours]
      operationId: consulterInscription
      summary: Consulter l'inscription d'un participant à un cours
      description: |
        Ressource désignée par l'en-tête Location de la création d'une inscription.
        Donne le statut et, en liste d'attente, la position (1 = prochain promu).
      security: []
      parameters:
        - $ref: "#/components/parameters/CoursId"
        - $ref: "#/components/parameters/ParticipantId"
      responses:
        "200":
          description: Inscription trouvée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inscription" }
        "404": { $ref: "#/components/responses/Probleme" }

components:
  parameters:
    CoursId:
      name: coursId
      in: path
      required: true
      description: Identifiant du cours
      schema: { type: string, format: uuid }
    ParticipantId:
      name: participantId
      in: path
      required: true
      description: Identifiant du participant
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      description: Nombre maximum d'éléments renvoyés (pagination offset)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Nombre d'éléments à sauter depuis le début de la collection
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Probleme" }

  schemas:
    CreerCours:
      type: object
      required: [intitule, places, debut]
      properties:
        intitule:
          type: string
          minLength: 1
          maxLength: 200
          description: Titre du cours
        places:
          type: integer
          minimum: 1
          description: Capacité maximale (value object Capacite)
        debut:
          type: string
          format: date-time
          description: Date et heure de début du cours

    InscrireParticipant:
      type: object
      required: [participantId]
      properties:
        participantId:
          type: string
          format: uuid
          description: Identifiant du participant à inscrire

    Cours:
      type: object
      required: [id, intitule, places, debut, nombreInscrits, placesRestantes]
      properties:
        id: { type: string, format: uuid }
        intitule: { type: string }
        places:
          type: integer
          minimum: 1
          description: Capacité du cours
        debut: { type: string, format: date-time }
        nombreInscrits:
          type: integer
          minimum: 0
        placesRestantes:
          type: integer
          minimum: 0

    PageCours:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Cours" }
        total:
          type: integer
          minimum: 0
          description: Nombre total de cours (toutes pages confondues)
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    ResultatInscription:
      type: object
      required: [participantId, statut]
      properties:
        participantId: { type: string, format: uuid }
        statut:
          type: string
          enum: [inscrit, en_liste_attente]
          description: Issue de l'inscription selon la capacité restante

    Inscription:
      type: object
      required: [participantId, statut, position]
      properties:
        participantId: { type: string, format: uuid }
        statut:
          type: string
          enum: [inscrit, en_liste_attente]
        position:
          type: [integer, "null"]
          minimum: 1
          description: Rang dans la liste d'attente ; null si le participant est inscrit

    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
